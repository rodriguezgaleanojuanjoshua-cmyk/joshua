    <body>
        
    <form action="">
        <h2>Datos personales basicos</h2>

        <!--Titulos cajones-->
        <label for="">Nombre de usuario</label>
        <!--Texto del cuadro-->
        <input type="text" id="nombreUsuario"name="nombre" placeholder="Ej: joshua rodriguez">

        <br><br>

        <label for="CorreodeUsuario">correo Electronico</label>
        <input type="text" id="CorreodeUsuario" name="email" placeholder="Correo@ejemplo.com" required>
    </form>

    <form action=" ">
        <h2>Diferentes tipos de imputs</h2>
        <label for="pass">"Contrasena:" </label>
        <input type="password" name="clave" id="pass">
        <br><br>
        <label for="edad">Edad: </label>
        <input type="number" id="edad" name="edad" min="18" max="99">
        <br><br>

        <label for="nacimiento Fecha nacimiento"></label>
        <input type="date" id="nacimiento" name="Fecha_nac">
        <br><br>
        <p>Selecciona un plan:</p>
        <input type="radio" name="Plan" id="planGratis">
        <label for="planGratis">plan Gratis</label>
 
        <input type="radio" name="Plan" id="planPro">
        <label for="planGratis">plan Pro</label>
 
        <input type="radio" name="Plan" id="planDiamante">
        <label for="planGratis">plan Diamante</label>
        <br><br>
 
        <input type="checkbox" id="terminos" name="terminos" required>
        <label for="terminos">Acepto terminos y condiciones</label>

        <button type="submit">Enviar formulario</button>
        <button type="reset">Limpiar formulario</button>
    </form>
